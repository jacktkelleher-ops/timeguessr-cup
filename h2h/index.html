<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TimeGuessr Cup · Head-to-Heads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#15212b; --muted:#5d6b76; --line:#d5dde2;
  --accent:#1d6a86; --gold:#b7861b;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0f161c; --surface:#17222b; --ink:#e6edf1; --muted:#93a3ae; --line:#2a3944;
  --accent:#5fb3d1; --gold:#e0b04a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:18px}
.wrap > *{min-width:0}
.back{font-size:14px;color:var(--accent);text-decoration:none}
.back:hover,.back:focus-visible{text-decoration:underline}
h1{font:800 clamp(28px,6vw,40px)/1.05 var(--display);letter-spacing:-.02em;margin:6px 0 0}
.sub{color:var(--muted);margin:6px 0 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 0}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:10px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{padding-left:14px;white-space:normal}
th:last-child,td:last-child{padding-right:14px}
tr:last-child td{border-bottom:0}
th{font:500 12px var(--body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
th.num,td.num{text-align:right}
.who{display:inline-flex;align-items:center;gap:10px;line-height:1.25}
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid;flex:none}
.price{display:inline-block;min-width:58px;text-align:center;font:600 15px var(--mono);padding:5px 10px;border-radius:6px;background:color-mix(in srgb, var(--accent) 14%, transparent);color:var(--ink)}
.fav .price{background:color-mix(in srgb, var(--gold) 26%, transparent)}
.dec{display:block;font:500 11px var(--mono);color:var(--muted);margin-top:2px;text-align:center}
.stake{font:600 15px var(--mono)}
.nr td{color:var(--muted)}
.nr .price{background:transparent;border:1px dashed var(--line);color:var(--muted)}
.tbl{overflow-x:auto}
.notes{font-size:13px;color:var(--muted);margin:0;display:grid;gap:4px}
.notes p{margin:0}

.pick{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:end}
.pick label{display:grid;gap:6px;font-size:13px;color:var(--muted);min-width:0}
.pick select{font:500 15px var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 10px;width:100%;min-width:0}
.pick select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vs{font:800 16px var(--display);color:var(--muted);padding-bottom:10px}
.duel{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.side{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px 14px;display:grid;justify-items:center;gap:8px;text-align:center;min-width:0}
.side.fav{border-color:var(--gold)}
.side .av{width:64px;height:64px;border-width:3px}
.side .nm{font:600 16px var(--body);line-height:1.25}
.side .price{font-size:20px;min-width:84px;padding:8px 12px}
.side .dec{margin-top:-4px}
.side .ms{font-size:13px;color:var(--muted)}
.side .ms b{font:600 15px var(--mono);color:var(--ink)}
.msg{color:var(--muted);text-align:center;margin:8px 0}
@media (max-width:380px){.pick{grid-template-columns:1fr}.vs{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div>
    <a class="back" href="../">← Back to the leaderboard</a>
    <h1>Head-to-heads</h1>
    <p class="sub">Week 6 · Wednesday 18 November. Who scores more that round.</p>
  </div>

  <div class="pick">
    <label for="pa">Player A<select id="pa"></select></label>
    <span class="vs" aria-hidden="true">v</span>
    <label for="pb">Player B<select id="pb"></select></label>
  </div>

  <div id="duel" class="duel" aria-live="polite"></div>

  <div class="notes">
    <p>Max stake caps the payout at €20 profit per bet. A tie means stakes are returned.</p>
  </div>
</div>

<script>
const M = {"wsd":4433,"players":{"Aaron Daly":{"mu":40982,"se":1408},"Alan Mccarthy":{"mu":37222,"se":1408},"Conor":{"mu":38892,"se":1408},"Cormac":{"mu":38390,"se":1408},"Darragh O'Connor":{"mu":37915,"se":1408},"Daniel O Sullivan":{"mu":36576,"se":1408},"Jack Carrigy":{"mu":34658,"se":1484},"Jack Keane":{"mu":38140,"se":1408},"Jack Kelleher":{"mu":39929,"se":1408},"Luke Merriman":{"mu":37990,"se":1408},"Paul Tobin":{"mu":36836,"se":1408}}};
const PALETTE = ["#1d6a86","#c2552d","#4c8a3a","#8a4fb0","#b7861b","#2f8f8a","#a13d63","#5b6770","#d07a1f","#3b5bb5","#7a9a2a","#c03a3a"];
const ORDER = ["Aaron Daly","Alan Mccarthy","Conor","Cormac","Darragh O'Connor","David Aherne","Daniel O Sullivan","Jack Carrigy","Jack Keane","Jack Kelleher","Luke Merriman","Paul Tobin"];
const MARGIN = 0.20, LIMIT = 20;
const LADDER = ["1/20","1/16","1/14","1/12","1/11","1/10","1/9","1/8","1/7","2/13","1/6","2/11","1/5","2/9","1/4","2/7","3/10","1/3","4/11","2/5","5/12","4/9","9/20","1/2","8/15","4/7","8/13","5/8","4/6","8/11","3/4","4/5","5/6","10/11","19/20","1/1","21/20","11/10","6/5","5/4","11/8","6/4","13/8","7/4","15/8","2/1","9/4","5/2","11/4","3/1","10/3","7/2","4/1","9/2","5/1"];
const fracVal = f => { const [a, b] = f.split("/").map(Number); return a / b; };
const names = Object.keys(M.players).sort((a, b) => a.localeCompare(b));
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const color = p => PALETTE[Math.max(0, ORDER.indexOf(p)) % PALETTE.length];
const photo = p => "../avatars/" + p.replace(/'/g, "").replace(/ /g, "_") + ".jpg";
// standard normal CDF
function Phi(x){ const t = 1 / (1 + 0.2316419 * Math.abs(x)); const d = 0.3989423 * Math.exp(-x * x / 2);
  const p = d * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return x > 0 ? 1 - p : p; }
// price a side: add half the margin to its fair chance, then take the longest standard price that keeps at least that margin
function price(fair){
  const implied = fair + MARGIN / 2, target = 1 / implied - 1;
  let best = LADDER[0];
  for (const f of LADDER) if (fracVal(f) <= target + 1e-9) best = f;
  return best;
}
function side(p, f, fav){
  const stake = Math.floor(LIMIT / fracVal(f) * 100) / 100;
  return `<div class="side${fav ? " fav" : ""}">
    <img class="av" src="${photo(p)}" alt="" style="border-color:${color(p)}">
    <span class="nm">${esc(p)}</span>
    <span class="price">${f === "1/1" ? "Evens" : f}</span><span class="dec">${(1 + fracVal(f)).toFixed(2)}</span>
    <span class="ms">Max stake <b>€${stake.toFixed(2)}</b></span></div>`;
}
function render(){
  const a = $("pa").value, b = $("pb").value;
  if (a === b){ $("duel").innerHTML = '<p class="msg" style="grid-column:1/-1">Pick two different players.</p>'; return; }
  const A = M.players[a], B = M.players[b];
  const pA = Phi((A.mu - B.mu) / Math.sqrt(2 * M.wsd * M.wsd + A.se * A.se + B.se * B.se));
  const fa = price(pA), fb = price(1 - pA);
  $("duel").innerHTML = side(a, fa, pA > 0.5) + side(b, fb, pA < 0.5);
}
const $ = id => document.getElementById(id);
const opts = names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
$("pa").innerHTML = opts; $("pb").innerHTML = opts;
$("pa").value = "Aaron Daly"; $("pb").value = "Jack Kelleher";
$("pa").addEventListener("change", render); $("pb").addEventListener("change", render);
render();
</script>
</body>
</html>
